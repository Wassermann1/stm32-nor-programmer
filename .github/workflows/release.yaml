name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            cc: x86_64-w64-mingw32-gcc
            artifact: stm23-nor-programmer-${{ github.ref_name }}-windows.exe
          - os: linux
            cc: gcc
            artifact: stm23-nor-programmer-${{ github.ref_name }}-linux.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest
      
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install MinGW (for Windows)
        if: matrix.os == 'windows'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build ${{ matrix.os }}
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.os }}
          GOARCH: amd64
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          
          fyne package -os ${{ matrix.os }} \
            -name "stm23-nor-programmer" \
            -icon "stm23-nor-programmer.png"
            -app-version ${VERSION#v} \
            -release
          
          if [ "${{ matrix.os }}" = "windows" ]; then
            mv "stm23-nor-programmer.exe" "${{ matrix.artifact }}"
          else
            mv "stm23-nor-programmer.tar.xz" "${{ matrix.artifact }}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: stm23-nor-programmer-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: STM23 NOR Programmer ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            stm23-nor-programmer-*.exe
            stm23-nor-programmer-*
          draft: false
          prerelease: false
