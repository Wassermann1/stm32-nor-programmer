name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            cc: x86_64-w64-mingw32-gcc
            artifact: stm23-nor-programmer-${{ github.ref_name }}-windows.exe
          - os: linux
            cc: gcc
            artifact: stm23-nor-programmer-${{ github.ref_name }}-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Install MinGW (for Windows)
        if: matrix.os == 'windows'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build ${{ matrix.os }}
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.os }}
          GOARCH: amd64
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          # Используем имя без пробелов для исполняемого файла, 
          # чтобы избежать проблем с CLI, путями и загрузкой с GitHub
          fyne package -os ${{ matrix.os }} \
            -name "stm23-nor-programmer" \
            -appVersion ${VERSION#v} \
            -release \
            -out ${{ matrix.artifact }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stm23-nor-programmer-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: STM23 NOR Programmer ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}
            
            ## Binaries
            - `stm23-nor-programmer-${{ github.ref_name }}-windows.exe`
            - `stm23-nor-programmer-${{ github.ref_name }}-linux`
          files: |
            stm23-nor-programmer-*.exe
            stm23-nor-programmer-*
          draft: false
          prerelease: false